services:
  progressive-quality-gates:
    build:
      context: .
      dockerfile: Dockerfile.production
    deploy:
      replicas: 1
      resources:
        limits:
          cpus: '1000'
          memory: 2Gi
        reservations:
          cpus: '500'
          memory: 1Gi
    environment:
    - ENVIRONMENT=development
    - PYTHONPATH=/app/src
    - LOG_LEVEL=INFO
    healthcheck:
      interval: 30s
      retries: 3
      start_period: 40s
      test: curl -f http://localhost:8000/health || exit 1
      timeout: 10s
    ports:
    - 8000:8000
    restart: unless-stopped
    volumes:
    - ./logs:/app/logs
    - ./data:/app/data
version: '3.8'
