apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app: progressive-quality-gates
    environment: development
    version: v1.0.0
  name: progressive-quality-gates-development
  namespace: development
spec:
  replicas: 1
  selector:
    matchLabels:
      app: progressive-quality-gates
      environment: development
  strategy:
    rollingUpdate:
      maxSurge: 25%
      maxUnavailable: 25%
    type: RollingUpdate
  template:
    metadata:
      labels:
        app: progressive-quality-gates
        environment: development
    spec:
      containers:
      - env:
        - name: ENVIRONMENT
          value: development
        - name: PYTHONPATH
          value: /app/src
        image: progressive-quality-gates:development
        livenessProbe:
          httpGet:
            path: /health
            port: 8000
          initialDelaySeconds: 60
          periodSeconds: 30
        name: progressive-quality-gates
        ports:
        - containerPort: 8000
        readinessProbe:
          httpGet:
            path: /health
            port: 8000
          initialDelaySeconds: 30
          periodSeconds: 10
        resources:
          limits:
            cpu: 1000m
            memory: 2Gi
          requests:
            cpu: 500m
            memory: 1Gi
        volumeMounts:
        - mountPath: /app/logs
          name: logs
        - mountPath: /app/data
          name: data
      volumes:
      - emptyDir: {}
        name: logs
      - name: data
        persistentVolumeClaim:
          claimName: data-pvc
